# Stage config for Moshi with async chunked streaming (Phase 2).
#
# Differences from moshi.yaml (Phase 1):
#   - async_chunk: true — enables incremental code transfer between stages
#   - Stage 0 uses custom_process_next_stage_input_func for per-step chunking
#   - Stage 1 receives audio codes in chunks, decodes incrementally
#
# Streaming flow:
#   Stage 0 (dialogue) generates one temporal step at a time,
#   emitting 8 audio codes per step via the chunked processor.
#   Every 25 steps (2 seconds), a chunk is forwarded to Stage 1.
#   Stage 1 (mimi_decode) decodes each chunk to waveform and
#   returns it as a partial audio output.
#
# Model: kmhf/hf-moshiko (HuggingFace Transformers format)
# Reference: https://arxiv.org/abs/2410.00037
# Hardware: 1x H100-80G GPU

async_chunk: true

stage_args:
  # ===== STAGE 0: Moshi Dialogue (Streaming) =====
  # Temporal Transformer (7B) + Depth Transformer (6L).
  # In streaming mode, the scheduler drives the AR loop step-by-step
  # and uses put_chunk() to emit audio codes after each step.
  - stage_id: 0
    stage_type: llm
    runtime:
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_stage: dialogue
      model_arch: MoshiForConditionalGenerationVLLM
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      gpu_memory_utilization: 0.85
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      enable_prefix_caching: false
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 65536
      tensor_parallel_size: 1
    final_output: true
    final_output_type: text
    is_comprehension: true
    # Chunked output processor: accumulates audio codes and forwards
    # to Stage 1 every MOSHI_CHUNK_SIZE (25) frames = 2 seconds.
    custom_process_next_stage_input_func: >-
      vllm_omni.model_executor.stage_input_processors.moshi_streaming.dialogue_to_mimi_async_chunk
    default_sampling_params:
      temperature: 0.7
      top_k: 50
      max_tokens: 16384
      seed: 42
      detokenize: false

  # ===== STAGE 1: Mimi Decode (Streaming) =====
  # Receives chunked audio codes and decodes to waveform incrementally.
  # Each chunk = 25 frames * 8 codebooks = 200 tokens → 2 seconds audio.
  - stage_id: 1
    stage_type: llm
    runtime:
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_stage: mimi_decode
      model_arch: MoshiForConditionalGenerationVLLM
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      gpu_memory_utilization: 0.05
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: audio
      async_scheduling: false
      enable_prefix_caching: false
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 500000
    engine_input_source: [0]
    final_output: true
    final_output_type: audio
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: false
