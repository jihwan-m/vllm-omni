# Stage config for Moshi full-duplex mode (Phase 3).
#
# Unlike Phase 1 (moshi.yaml) and Phase 2 (moshi_streaming.yaml),
# full-duplex mode bypasses the standard multi-stage pipeline.
#
# Instead, the DuplexStageWorker drives the dialogue model directly
# via forward_dialogue_step(), reading user audio from a RingBuffer
# and emitting audio codes to a BidirectionalChannel.
#
# The Mimi decode step (codes → PCM waveform) is handled by the
# DuplexSessionManager output pipeline, not by a separate stage.
#
# This config is used for model loading and initialization only.
# The actual generation loop is controlled by DuplexStageWorker.
#
# Model: kmhf/hf-moshiko (HuggingFace Transformers format)
# Reference: https://arxiv.org/abs/2410.00037
# Hardware: 1x H100-80G GPU

# Duplex mode flag — disables standard multi-stage pipeline scheduling
duplex: true

# Standard async_chunk is NOT used in duplex mode; the worker
# drives generation step-by-step via BidirectionalChannel.
async_chunk: false

stage_args:
  # ===== STAGE 0: Moshi Dialogue (Duplex) =====
  # Temporal Transformer (7B) + Depth Transformer (6L).
  #
  # In duplex mode, this stage is driven by DuplexStageWorker rather
  # than the standard scheduler. The worker calls:
  #   - model.init_streaming_state(request_id=...)
  #   - model.forward_dialogue_step(user_audio_codes=..., request_id=...)
  #   - model.clear_streaming_state(request_id=...)
  #
  # KV cache is managed by the model's per-request streaming state,
  # not by the scheduler's block allocator.
  - stage_id: 0
    stage_type: llm
    runtime:
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_stage: dialogue
      model_arch: MoshiForConditionalGenerationVLLM
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      gpu_memory_utilization: 0.90
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      enable_prefix_caching: false
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 65536
      tensor_parallel_size: 1
    final_output: true
    final_output_type: audio
    is_comprehension: true
    default_sampling_params:
      temperature: 0.7
      top_k: 50
      max_tokens: 16384
      seed: 42
      detokenize: false

# Duplex-specific configuration
duplex_config:
  # Maximum conversation duration before KV cache reset
  max_duration_s: 240

  # RingBuffer capacity (in 80ms frames)
  # 256 frames = ~20 seconds of user audio history
  ring_buffer_capacity: 256

  # Forward queue size (generated audio frames)
  # 128 frames = ~10 seconds of buffered output
  output_queue_size: 128

  # Number of RVQ codebooks per audio frame
  num_codebooks: 8

  # Maximum temporal steps before KV cache reset
  # Moshi supports ~3000 positions; reset at 2500 for safety
  max_temporal_steps: 2500

  # Session timeout (seconds) — close if no I/O for this long
  session_timeout_s: 300
